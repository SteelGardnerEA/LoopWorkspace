# Simulator-only check for the claude-work branch.
# Compiles Loop for the iOS Simulator, launches it, and saves screenshots.
# No code signing, no Apple account, no secrets, no upload to Apple.

name: Claude simulator check

on:
  workflow_dispatch:
  push:
    branches:
      - claude-work

concurrency:
  group: claude-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: Compile and screenshot (iOS Simulator)
    # Standard runner, free on public repositories. Not a paid larger runner.
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          best_major=-1
          for app in /Applications/Xcode.app /Applications/Xcode_*.app; do
            [ -d "${app}" ] || continue
            ver=$(defaults read "${app}/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            major=${ver%%.*}
            case "${major}" in ''|*[!0-9]*) major=0 ;; esac
            if [ "${major}" -gt "${best_major}" ]; then best_major=${major}; selected=${app}; fi
          done
          [ -n "${selected}" ] || { echo "No Xcode app found"; exit 1; }
          echo "Using ${selected}"
          sudo xcode-select -s "${selected}/Contents/Developer"
          xcodebuild -version

      - name: Apply patches (if any)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patch files. Building the untouched code."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            git apply "${patch}" --verbose --whitespace=fix
          done

      - name: Compile Loop (iOS Simulator, no signing)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace LoopWorkspace.xcworkspace \
            -scheme LoopWorkspace \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            | tee build/xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "xcodebuild exit ${status}" | tee build/build-summary.txt
          xcodebuild -version >> build/build-summary.txt
          if [ "$status" -ne 0 ]; then
            { grep -E 'error:|fatal error:|BUILD FAILED' build/xcodebuild.log || true; } | tail -n 80 > build/build-errors.txt
            exit "$status"
          fi
          echo "BUILD SUCCEEDED" >> build/build-summary.txt

      - name: Launch in simulator and screenshot
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mkdir -p build/screenshots
          APP=$(find build/DerivedData -type d -path '*Debug-iphonesimulator*' -name 'Loop.app' | head -n 1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist" | tr -d '[:space:]')
          echo "App ${APP} (${BUNDLE_ID})" | tee build/screenshots/README.txt
          DEVICE_TYPE=$(xcrun simctl list devicetypes | sed -n 's/.*(\(com.apple.CoreSimulator.SimDeviceType.iPhone-1[67][^)]*\)).*/\1/p' | head -n 1 | tr -d '[:space:]')
          RUNTIME=$(xcrun simctl list runtimes available | sed -n 's/.*(\(com.apple.CoreSimulator.SimRuntime.iOS-[^)]*\)).*/\1/p' | tail -n 1 | tr -d '[:space:]')
          UDID=""
          if [ -n "${DEVICE_TYPE}" ] && [ -n "${RUNTIME}" ]; then
            UDID=$(xcrun simctl create "ClaudeCheck" "${DEVICE_TYPE}" "${RUNTIME}" | tr -d '[:space:]' || true)
          fi
          if [ -z "${UDID}" ]; then
            UDID=$(xcrun simctl list devices available | sed -n 's/.*iPhone.*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p' | head -n 1 | tr -d '[:space:]')
          fi
          echo "Simulator ${UDID} ${DEVICE_TYPE} ${RUNTIME}" | tee -a build/screenshots/README.txt
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b || true
          xcrun simctl install "${UDID}" "${APP}"
          # -ClaudeChartPreview opens a debug-only chart screen with made-up data.
          # It exists only in debug builds and never starts Loop.
          shot() {
            local name="$1"
            shift
            xcrun simctl terminate "${UDID}" "${BUNDLE_ID}" >/dev/null 2>&1 || true
            xcrun simctl launch "${UDID}" "${BUNDLE_ID}" -ClaudeChartPreview "$@" || true
            sleep 12
            xcrun simctl io "${UDID}" screenshot "build/screenshots/${name}.png" || true
          }
          xcrun simctl ui "${UDID}" appearance light || true
          shot charts-light
          shot charts-light-60-hours-back -ClaudeChartPreviewHoursBack 60
          shot charts-light-24-hour-zoom -ClaudeChartPreviewZoomHours 24
          shot charts-light-mid-drag -ClaudeChartPreviewHoursBack 60 -ClaudeChartPreviewDragPoints 120
          shot charts-light-hold -ClaudeChartPreviewHoursBack 6 -ClaudeChartPreviewHoldX 220
          shot meal-breakdown -ClaudeMealPreview
          shot meal-breakdown-confirm -ClaudeMealPreview -ClaudeMealPreviewConfirm
          shot meal-breakdown-one-off -ClaudeMealPreview -ClaudeMealPreviewOneOff -ClaudeMealPreviewConfirm
          shot meal-settings -ClaudeMealSettingsPreview
          xcrun simctl ui "${UDID}" appearance dark || true
          shot charts-dark
          xcrun simctl ui "${UDID}" appearance light || true

          # Any crash reports from this run, printed into the log.
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -n 3); do
            echo "CLAUDE-CRASH-REPORT ${report}"
            head -c 6000 "${report}"
            echo ""
            echo "CLAUDE-CRASH-REPORT-END"
          done

      - name: Print screenshots into the log
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Small JPEG copies, text-encoded between markers, so they can be read from the log.
          shopt -s nullglob
          # Printed slowly in small chunks, because a fast burst can be dropped from the log.
          for png in build/screenshots/charts-light-60-hours-back.png build/screenshots/charts-light-hold.png; do
            name=$(basename "${png}" .png)
            sips -Z 900 -s format jpeg -s formatOptions 45 "${png}" --out "build/${name}.jpg" >/dev/null
            base64 -b 100 -i "build/${name}.jpg" > "build/${name}.b64"
            echo "" >> "build/${name}.b64"
            echo "CLAUDE-SHOT-BEGIN ${name}"
            split -l 100 "build/${name}.b64" "build/${name}.part."
            for part in "build/${name}.part."*; do
              cat "${part}"
              sleep 1
            done
            echo "CLAUDE-SHOT-END ${name}"
            sleep 2
          done

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-simulator-check
          if-no-files-found: warn
          path: |
            build/xcodebuild.log
            build/build-summary.txt
            build/build-errors.txt
            build/screenshots/
